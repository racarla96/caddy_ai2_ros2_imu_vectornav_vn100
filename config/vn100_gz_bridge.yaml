# Puente Gazebo Harmonic -> ROS 2 para el VN-100 simulado.
# Los nombres ROS replican los del driver real (fork de Robotnik, con remapeo en vn100.launch.py)
# y el sistema de ejes es el mismo que la salida rep103 del driver (mundo ENU, cuerpo FLU).
- ros_topic_name: "vectornav/imu"
  gz_topic_name: "vectornav/imu"
  ros_type_name: "sensor_msgs/msg/Imu"
  gz_type_name: "gz.msgs.IMU"
  direction: GZ_TO_ROS

- ros_topic_name: "vectornav/magnetic"
  gz_topic_name: "vectornav/magnetic"
  ros_type_name: "sensor_msgs/msg/MagneticField"
  gz_type_name: "gz.msgs.Magnetometer"
  direction: GZ_TO_ROS

- ros_topic_name: "vectornav/pressure"
  gz_topic_name: "vectornav/pressure"
  ros_type_name: "sensor_msgs/msg/FluidPressure"
  gz_type_name: "gz.msgs.FluidPressure"
  direction: GZ_TO_ROS
